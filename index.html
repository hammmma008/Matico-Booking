
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matico Nigro | حجز الملعب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101810;color:white;font-family:Arial,sans-serif}
header{background:#172b1c;padding:28px 15px;text-align:center;border-bottom:3px solid #b5e853}
header h1{margin:0;color:#b5e853;font-size:30px}
header p{color:#ddd}
.container{max-width:520px;margin:25px auto;padding:20px}
.card{background:#1b281e;padding:22px;border-radius:16px;box-shadow:0 5px 20px #0005}
h2{color:#b5e853;text-align:center}
label{display:block;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #52634e;border-radius:9px;background:#101810;color:white;font-size:16px}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:9px;background:#b5e853;color:#142016;font-weight:bold;font-size:17px;cursor:pointer}
button:disabled{opacity:.5}
#message{text-align:center;margin-top:15px;line-height:1.7}
footer{text-align:center;color:#aaa;padding:25px}
</style>
</head>
<body>

<header>
<h1>⚽ MATICO NIGRO</h1>
<p>احجز ملعبك واستمتع بالمباراة</p>
</header>

<div class="container">
<div class="card">
<h2>حجز الملعب</h2>

<form id="bookingForm">
<label>اسم اللاعب</label>
<input id="playerName" type="text" placeholder="أدخل اسمك" required>

<label>رقم الهاتف</label>
<input id="phone" type="tel" placeholder="رقم الهاتف" required>

<label>تاريخ الحجز</label>
<input id="bookingDate" type="date" required>

<label>ساعة الحجز</label>
<input id="bookingTime" type="time" required>

<button id="submitBtn" type="submit">إرسال طلب الحجز</button>
</form>

<div id="message"></div>
</div>
</div>

<footer>© 2026 Matico Nigro - جميع الحقوق محفوظة</footer>

<script>
const SUPABASE_URL = "https://gqokudgmvnifunpnijxu.supabase.co";
const SUPABASE_KEY = "sb_publishable_YX4gafdSgWq1XmhtytfEIw_g-Qh0k4a";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("bookingForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");
const dateInput = document.getElementById("bookingDate");

const today = new Date();
const localDate = new Date(today.getTime() - today.getTimezoneOffset()*60000)
.toISOString().split("T")[0];

dateInput.min = localDate;

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("playerName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const date = dateInput.value;
  const time = document.getElementById("bookingTime").value;

  if(!name || !phone || !date || !time){
    message.textContent = "يرجى ملء جميع المعلومات";
    return;
  }

  if(date < localDate){
    message.textContent = "لا يمكن اختيار تاريخ سابق";
    return;
  }

  const start = new Date(date + "T" + time);
  const end = new Date(start.getTime() + 60*60*1000);

  if(start <= new Date()){
    message.textContent = "يرجى اختيار موعد مستقبلي";
    return;
  }

  button.disabled = true;
  button.textContent = "جارٍ إرسال الطلب...";

  const { error } = await db
    .from("bookings")
    .insert([{
      player_name: name,
      phone: phone,
      booking_date: date,
      booking_time: time,
      status: "pending"
    }]);

  button.disabled = false;
  button.textContent = "إرسال طلب الحجز";

  if(error){
    console.error(error);
    message.textContent = "تعذر إرسال الطلب. تحقق من إعدادات قاعدة البيانات.";
    return;
  }

  message.textContent = "✅ تم إرسال طلبك بنجاح! انتظر موافقة الإدارة.";
  form.reset();
  dateInput.min = localDate;
});
</script>

</body>
</html>
